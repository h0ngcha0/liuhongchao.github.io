<svg xmlns="http://www.w3.org/2000/svg" class="guide-figure-svg" viewBox="0 0 800 330" width="100%" role="img" aria-labelledby="_R_0_-title _R_0_-desc" style="display:block;font-family:system-ui, sans-serif;font-size:14px"><title id="_R_0_-title">Waiting orders and completed trades</title><desc id="_R_0_-desc">An orange band shows a large resting order that disappears before price reaches it. Green and magenta circles mark actual trades. An empty gap in the recorded heatmap is unknown data, not proof of an empty book.</desc><rect width="800" height="330" rx="12" fill="#121211"></rect><g fill="#ecece8"><text x="38" y="30" font-size="19" font-weight="650">Waiting orders ≠ completed trades</text><rect x="38" y="48" width="724" height="214" rx="8" fill="#081423" stroke="#25374b"></rect><g stroke="#25374b"><path d="M39 96H761"></path><path d="M39 144H761"></path><path d="M39 192H761"></path><path d="M39 240H761"></path></g><path d="M52 104H377" stroke="#ff8a00" stroke-width="15"></path><path d="M52 79H430M450 79H745" stroke="#1479b8" stroke-width="8"></path><path d="M52 216H234M324 216H745" stroke="#7fd0f0" stroke-width="12"></path><path d="M52 238H234M324 238H745" stroke="#0a3a66" stroke-width="8"></path><rect x="244" y="201" width="70" height="49" fill="#081423" stroke="#8596a9" stroke-dasharray="4 4"></rect><path d="M58 178L114 167L167 180L220 158L275 167L331 151L383 160L438 143L492 152L547 126L603 137L658 114L733 124" stroke="#fff" stroke-width="3" fill="none"></path><circle cx="547" cy="126" r="14" fill="#10a35a" fill-opacity=".6" stroke="#10a35a" stroke-width="2"></circle><circle cx="603" cy="137" r="9" fill="#e0157f" fill-opacity=".6" stroke="#e0157f" stroke-width="2"></circle><g fill="#dce6ef" font-size="17"><text x="70" y="130">Resting wall</text><path d="M146 119V111" stroke="#dce6ef"></path><text x="408" y="103">Cancelled</text><path d="M397 99H384" stroke="#dce6ef"></path><text x="564" y="189">Trades</text><path d="M593 173L556 140" stroke="#dce6ef"></path></g><path d="M279 254V280H361" fill="none" stroke="#9a9a93"></path><text x="371" y="285" font-size="16">Gap = unknown</text><g font-size="14" fill="#9a9a93"><text x="38" y="314">Less size</text><rect x="157" y="301" width="28" height="14" fill="#0a3a66"></rect><rect x="185" y="301" width="28" height="14" fill="#1479b8"></rect><rect x="213" y="301" width="28" height="14" fill="#7fd0f0"></rect><rect x="241" y="301" width="28" height="14" fill="#f4fbff"></rect><rect x="269" y="301" width="28" height="14" fill="#ffe14a"></rect><rect x="297" y="301" width="28" height="14" fill="#ff8a00"></rect><text x="336" y="314">More size</text><text x="762" y="314" text-anchor="end">Orders can move or cancel</text></g></g></svg>
