><text x="572" y="259" fill="#c9d8e9" font-size="12">SESSION TIME →</text><text x="38" y="303" font-size="16" fill="#9a9a93">Blue: session VWAP + bands</text><text x="406" y="303" font-size="16" fill="#9a9a93">White: traded price · Days use UTC</text></g></svg>
