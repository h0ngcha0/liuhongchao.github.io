<svg xmlns="http://www.w3.org/2000/svg" class="guide-figure-svg" viewBox="0 0 800 330" width="100%" role="img" aria-labelledby="_R_0_-title _R_0_-desc" style="display:block;font-family:system-ui, sans-serif;font-size:14px"><title id="_R_0_-title">Executions in time and volume by price</title><desc id="_R_0_-desc">Green buy and magenta sell bubbles show completed taker orders through time. A separate horizontal volume profile groups traded dollars by price, with the longest row marked POC and a purple value area bounded by VAH and VAL.</desc><rect width="800" height="330" rx="12" fill="#121211"></rect><g fill="#ecece8"><text x="38" y="30" font-size="19" font-weight="650">Taker orders</text><text x="458" y="30" font-size="19" font-weight="650">Volume by price</text><rect x="38" y="48" width="376" height="221" rx="8" fill="#081423" stroke="#25374b"></rect><rect x="444" y="48" width="318" height="221" rx="8" fill="#081423" stroke="#25374b"></rect><g stroke="#25374b"><path d="M39 91H413M445 91H761"></path><path d="M39 133H413M445 133H761"></path><path d="M39 175H413M445 175H761"></path><path d="M39 217H413M445 217H761"></path></g><path d="M56 215L93 189L127 201L163 173L202 180L239 144L279 157L319 128L351 141L398 103" stroke="#c9d8e9" fill="none" stroke-width="2"></path><g stroke-width="2"><circle cx="93" cy="189" r="9" fill="#10a35a" fill-opacity=".5" stroke="#10a35a"></circle><circle cx="163" cy="173" r="22" fill="#10a35a" fill-opacity=".6" stroke="#10a35a"></circle><circle cx="202" cy="180" r="11" fill="#e0157f" fill-opacity=".5" stroke="#e0157f"></circle><circle cx="279" cy="157" r="27" fill="#e0157f" fill-opacity=".6" stroke="#e0157f"></circle><circle cx="351" cy="141" r="17" fill="#10a35a" fill-opacity=".6" stroke="#10a35a"></circle></g><rect x="152" y="165" width="22" height="16" rx="3" fill="#36baa8"></rect><text x="163" y="177" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">HL</text><rect x="268" y="149" width="22" height="16" rx="3" fill="#8b5cf6"></rect><text x="279" y="161" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">PH</text><g fill="#c9d8e9" font-size="12"><text x="54" y="71">PRICE ↑</text><text x="388" y="251" text-anchor="end">TIME →</text></g><rect x="458" y="104" width="222" height="101" fill="#9575f0" opacity=".16"></rect><g><rect x="465" y="71" width="25.65" height="13" fill="#10a35a" opacity=".8"></rect><rect x="490.65" y="71" width="19.35" height="13" fill="#e0157f" opacity=".8"></rect></g><g><rect x="465" y="94" width="45.029999999999994" height="13" fill="#10a35a" opacity=".8"></rect><rect x="510.03" y="94" width="33.97" height="13" fill="#e0157f" opacity=".8"></rect></g><g><rect x="465" y="117" width="71.82" height="13" fill="#10a35a" opacity=".8"></rect><rect x="536.8199999999999" y="117" width="54.18" height="13" fill="#e0157f" opacity=".8"></rect></g><g><rect x="465" y="140" width="104.30999999999999" height="13" fill="#10a35a" opacity=".8"></rect><rect x="569.31" y="140" width="78.69" height="13" fill="#e0157f" opacity=".8"></rect></g><g><rect x="465" y="163" width="86.07" height="13" fill="#10a35a" opacity=".8"></rect><rect x="551.0699999999999" y="163" width="64.92999999999999" height="13" fill="#e0157f" opacity=".8"></rect></g><g><rect x="465" y="186" width="55.85999999999999" height="13" fill="#10a35a" opacity=".8"></rect><rect x="520.86" y="186" width="42.14" height="13" fill="#e0157f" opacity=".8"></rect></g><g><rect x="465" y="209" width="34.769999999999996" height="13" fill="#10a35a" opacity=".8"></rect><rect x="499.77" y="209" width="26.23" height="13" fill="#e0157f" opacity=".8"></rect></g><g><rect x="465" y="232" width="15.959999999999999" height="13" fill="#10a35a" opacity=".8"></rect><rect x="480.96" y="232" width="12.04" height="13" fill="#e0157f" opacity=".8"></rect></g><g stroke="#9575f0" fill="#c8b5ff" font-size="16"><path d="M458 104H691M458 205H691" stroke-dasharray="4 4"></path><path d="M458 146H691"></path><text x="700" y="108" stroke="none">VAH</text><text x="700" y="150" stroke="none">POC</text><text x="700" y="209" stroke="none">VAL</text></g><text x="38" y="295" fill="#9a9a93" font-size="15">Bigger bubble = bigger order</text><text x="458" y="295" fill="#9a9a93" font-size="15">Purple area = 70% of volume</text><text x="38" y="318" fill="#10a35a" font-size="16">Buys lift asks</text><text x="224" y="318" fill="#e0157f" font-size="16">Sells hit bids</text></g></svg>
