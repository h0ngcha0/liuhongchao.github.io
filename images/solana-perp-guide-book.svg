<svg xmlns="http://www.w3.org/2000/svg" class="guide-figure-svg" viewBox="0 0 800 330" width="100%" role="img" aria-labelledby="_R_0_-title _R_0_-desc" style="display:block;font-family:system-ui, sans-serif;font-size:14px"><title id="_R_0_-title">A price ladder and its running totals</title><desc id="_R_0_-desc">Magenta ask rows sit above green bid rows. Short solid bars show size at each price; pale stair steps show cumulative size away from the spread. Venue chips identify the five sources.</desc><rect width="800" height="330" rx="12" fill="#121211"></rect><g fill="#ecece8"><text x="38" y="30" font-size="19" font-weight="650">Solid bars: each price · Pale shape: running total</text><rect x="38" y="48" width="493" height="238" rx="8" fill="#1b1b19" stroke="#2c2c29"></rect><text x="58" y="73" fill="#9a9a93" font-size="12">PRICE ↑</text><text x="237" y="73" fill="#9a9a93" font-size="12">RESTING SIZE →</text><path d="M179 91H444V116H380V141H323V153H179Z" fill="#e0157f" opacity=".14"></path><path d="M179 187H276V211H337V236H408V262H469H179Z" fill="#10a35a" opacity=".14"></path><g><path d="M58 101h61" stroke="#e0157f" stroke-width="3"></path><rect x="179" y="91" width="178" height="15" rx="2" fill="#e0157f" opacity=".8"></rect></g><g><path d="M58 126h61" stroke="#e0157f" stroke-width="3"></path><rect x="179" y="116" width="108" height="15" rx="2" fill="#e0157f" opacity=".8"></rect></g><g><path d="M58 151h61" stroke="#e0157f" stroke-width="3"></path><rect x="179" y="141" width="63" height="15" rx="2" fill="#e0157f" opacity=".8"></rect></g><g><path d="M58 202h61" stroke="#10a35a" stroke-width="3"></path><rect x="179" y="192" width="82" height="15" rx="2" fill="#10a35a" opacity=".8"></rect></g><g><path d="M58 227h61" stroke="#10a35a" stroke-width="3"></path><rect x="179" y="217" width="129" height="15" rx="2" fill="#10a35a" opacity=".8"></rect></g><g><path d="M58 252h61" stroke="#10a35a" stroke-width="3"></path><rect x="179" y="242" width="165" height="15" rx="2" fill="#10a35a" opacity=".8"></rect></g><path d="M50 169H516" stroke="#9a9a93" stroke-dasharray="4 4"></path><text x="68" y="173" fill="#9a9a93" font-size="11">MID</text><path d="M149 151H157V187H149" stroke="#9a9a93" fill="none"></path><text x="550" y="104" fill="#e0157f" font-size="19" font-weight="650">Asks</text><text x="550" y="129" fill="#9a9a93" font-size="13">Above the best bid</text><text x="550" y="174" font-size="19" font-weight="650">Spread</text><text x="550" y="196" fill="#9a9a93" font-size="13">Best ask minus best bid</text><text x="550" y="242" fill="#10a35a" font-size="19" font-weight="650">Bids</text><text x="550" y="267" fill="#9a9a93" font-size="13">Below the best ask</text><path d="M531 169H542" stroke="#9a9a93"></path><g font-size="11" font-weight="700" text-anchor="middle" fill="#fff"><g><rect x="38" y="300" width="28" height="18" rx="4" fill="#36baa8"></rect><text x="52" y="313">HL</text></g><g><rect x="73" y="300" width="28" height="18" rx="4" fill="#e29222"></rect><text x="87" y="313">PA</text></g><g><rect x="108" y="300" width="28" height="18" rx="4" fill="#8b5cf6"></rect><text x="122" y="313">PH</text></g><g><rect x="143" y="300" width="28" height="18" rx="4" fill="#3b82f6"></rect><text x="157" y="313">BL</text></g><g><rect x="178" y="300" width="28" height="18" rx="4" fill="#84cc16"></rect><text x="192" y="313">BK</text></g></g><text x="225" y="314" font-size="16" fill="#9a9a93">Venue colours = sources · Green / pink = sides</text></g></svg>
